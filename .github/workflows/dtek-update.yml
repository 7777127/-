name: DTEK schedule update

on:
  push:
    paths:
      - "dtek_fetch.py"
      - "requirements-dtek.txt"
      - ".github/workflows/dtek-update.yml"
  workflow_dispatch:
  schedule:
    - cron: "0 */2 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install DTEK client
        run: pip install -r requirements-dtek.txt

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Fetch DTEK schedule
        run: python dtek_fetch.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dtek-data.json
          git diff --cached --quiet || git commit -m "Update DTEK schedule"
          git push
